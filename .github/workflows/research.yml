name: daily-research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/research.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/research.yml"
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: btc-quant-daily-research-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acquire-qa-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Lint
        run: ruff check src tests scripts
      - name: Acquire, QA, cross-check, and evaluate
        id: research
        continue-on-error: true
        run: python scripts/run_research.py
      - name: Persist raw data, manifests, reports and append-only ledger
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/
          git add reports/latest ledger/forecast_ledger.csv ledger/challenger_log.csv
          if git diff --cached --quiet; then
            echo "No persistent changes to commit"
          else
            git commit -m "chore(research): persist BTC Quant Desk run ${{ github.run_id }}"
            # Rebase the evidence commit onto the latest main to avoid a non-fast-forward
            # if a documentation/code commit landed while this run was executing.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Verify persisted remote evidence
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && steps.research.outcome == 'success'
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          python - <<'PY'
          import csv
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          required = [
              "reports/latest/run_report.json",
              "reports/latest/daily_report.md",
              "reports/latest/data_manifest.json",
              "reports/latest/scores.json",
              "reports/latest/oos_predictions.csv",
              "ledger/forecast_ledger.csv",
              "ledger/challenger_log.csv",
          ]
          for relative in required:
              local = Path(relative).read_bytes()
              remote = subprocess.check_output(["git", "show", f"origin/main:{relative}"])
              assert local == remote, f"remote read-back mismatch: {relative}"

          report = json.loads(Path("reports/latest/run_report.json").read_text())
          manifest = json.loads(Path("reports/latest/data_manifest.json").read_text())
          assert report["status"] == "COMPLETE_NOT_PROMOTED", report["status"]
          assert report["pre_report_review"]["status"] == "PASS"
          assert report["risk"]["theoretical_exposure_pct"] == 0
          ledger_bytes = Path("ledger/forecast_ledger.csv").read_bytes()
          ledger_sha = hashlib.sha256(ledger_bytes).hexdigest()
          assert report["post_persistence_verification"]["ledger_sha256"] == ledger_sha

          checked = 0
          for source in manifest["sources"]:
              for item in source.get("objects", []):
                  path = Path(item["file"])
                  raw = path.read_bytes()
                  assert len(raw) == item["size_bytes"], f"size mismatch: {path}"
                  assert hashlib.sha256(raw).hexdigest() == item["sha256"], f"SHA-256 mismatch: {path}"
                  remote_raw = subprocess.check_output(["git", "show", f"origin/main:{path.as_posix()}"])
                  assert remote_raw == raw, f"remote raw-data mismatch: {path}"
                  checked += 1

          with Path("ledger/forecast_ledger.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          event_ids = [row["event_id"] for row in rows]
          assert len(event_ids) == len(set(event_ids)), "duplicate ledger event IDs"
          print(f"REMOTE_PERSISTENCE_VERIFIED files={len(required)} raw_objects={checked} ledger_events={len(rows)} ledger_sha256={ledger_sha}")
          PY
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: btc-quant-run-${{ github.run_id }}
          path: |
            reports/latest/
            data/raw/
          if-no-files-found: warn
          retention-days: 90
      - name: Keep blocked PR research as diagnostic only
        if: steps.research.outcome == 'failure' && github.event_name == 'pull_request'
        run: echo "::warning::Research is BLOCKED for this PR run; diagnostic artifact is retained. Freshness and promotion gates are not waived."
      - name: Fail scheduled or manual research when blocked
        if: steps.research.outcome == 'failure' && github.event_name != 'pull_request'
        run: exit 1
