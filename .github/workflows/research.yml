name: daily-research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/research.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/research.yml"
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: btc-quant-daily-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire-qa-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: pytest
      - name: Lint
        run: ruff check src tests scripts
      - name: Acquire, QA, cross-check, and evaluate
        id: research
        continue-on-error: true
        run: python scripts/run_research.py
      - name: Persist raw data, manifests, reports and append-only ledger
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/
          git add reports/latest ledger/forecast_ledger.csv ledger/ohlcv_challenger_ledger.csv ledger/challenger_log.csv
          if git diff --cached --quiet; then
            echo "No persistent changes to commit"
          else
            git commit -m "chore(research): persist BTC Quant Desk run ${{ github.run_id }}"
            # Rebase the evidence commit onto the latest main to avoid a non-fast-forward
            # if a documentation/code commit landed while this run was executing.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: btc-quant-run-${{ github.run_id }}
          path: |
            reports/latest/
            data/raw/
            ledger/
          if-no-files-found: warn
          retention-days: 90
      - name: Fail run when research is blocked
        if: steps.research.outcome == 'failure'
        run: exit 1
